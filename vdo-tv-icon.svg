  <path d="M34 18 A23 23 0 0 1 74 18" fill="none" stroke="#8AB4F8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- TV Chassis (Periwinkle #8AB4F8) -->
  <rect x="25" y="31" width="58" height="40" rx="7" fill="#8AB4F8" />

  <!-- Inset Cinema Screen (Dark #0F131C) -->
