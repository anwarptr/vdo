<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Clean Velvet Dark Background -->
  <rect width="108" height="108" rx="24" fill="#0F131C" />
  <circle cx="54" cy="54" r="46" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Incoming Cast Waves (Periwinkle #8AB4F8) -->
