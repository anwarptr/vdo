  <path d="M26 27 A28 28 0 0 0 26 57" fill="none" stroke="#8AB4F8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <path d="M74 33 A20 20 0 0 1 74 51" fill="none" stroke="#8AB4F8" stroke-width="3" stroke-linecap="round" />
  <path d="M82 27 A28 28 0 0 1 82 57" fill="none" stroke="#8AB4F8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Modern Remote Chassis (Periwinkle #8AB4F8) -->
