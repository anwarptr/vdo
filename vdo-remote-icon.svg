<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Google TV Velvet Dark Studio Background -->
  <rect width="108" height="108" fill="#0F131C" rx="24"/>
  <circle cx="54" cy="54" r="46" fill="#181D2A"/>
  <circle cx="54" cy="54" r="32" fill="#283248"/>

  <!-- Radiating Cast Signal Waves (Google TV Periwinkle) -->
  <path stroke="#8AB4F8" stroke-width="3" stroke-linecap="round" fill="none" d="M81,38 a26,26 0 0,1 0,32" />
  <path stroke="#A8C7FA" stroke-width="3.2" stroke-linecap="round" fill="none" d="M75,44 a18,18 0 0,1 0,20" />
  <path stroke="#8AB4F8" stroke-width="3" stroke-linecap="round" fill="none" d="M27,38 a26,26 0 0,0 0,32" />
  <path stroke="#A8C7FA" stroke-width="3.2" stroke-linecap="round" fill="none" d="M33,44 a18,18 0 0,0 0,20" />

  <!-- Sleek Modern Smartphone Remote Body -->
  <rect x="43" y="26" width="22" height="56" rx="6" fill="#8AB4F8"/>

  <!-- Inset Display Screen -->
  <rect x="41" y="33" width="26" height="28" rx="2" fill="#0F131C"/>

  <!-- Glowing Play Emblem -->
  <polygon points="50,42 62,47 50,52" fill="#A8C7FA"/>

  <!-- Remote Navigation Keypad Array -->
  <circle cx="54" cy="69" r="3.5" fill="#0F131C"/>
  <circle cx="45" cy="69" r="1.8" fill="#0F131C"/>
  <circle cx="63" cy="69" r="1.8" fill="#0F131C"/>
</svg>
