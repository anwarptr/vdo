  <line x1="54" y1="72" x2="54" y2="73.5" stroke="#8AB4F8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="47.5" y1="67" x2="49" y2="67" stroke="#8AB4F8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="59" y1="67" x2="60.5" y2="67" stroke="#8AB4F8" stroke-width="1.2" stroke-linecap="round" />
</svg>
