  <path stroke="#00E5FF" stroke-width="3.2" stroke-linecap="round" fill="none" d="M75,44 a18,18 0 0,1 0,20" />
  <path stroke="#818CF8" stroke-width="3" stroke-linecap="round" fill="none" d="M27,38 a26,26 0 0,0 0,32" />
  <path stroke="#00E5FF" stroke-width="3.2" stroke-linecap="round" fill="none" d="M33,44 a18,18 0 0,0 0,20" />

