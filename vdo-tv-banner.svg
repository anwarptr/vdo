<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="640" height="360">
  <!-- Clean Velvet Dark Background -->
  <rect width="320" height="180" rx="14" fill="#0F131C" />
  <rect width="318" height="178" x="1" y="1" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- LEFT: TV Display Artwork (Periwinkle #8AB4F8 + White #FFFFFF) -->
  <!-- Top Incoming Waves -->
  <path d="M62 44 A20 20 0 0 1 98 44" fill="none" stroke="#8AB4F8" stroke-width="3.5" stroke-linecap="round" />
  <path d="M52 35 A30 30 0 0 1 108 35" fill="none" stroke="#8AB4F8" stroke-width="2.8" stroke-linecap="round" opacity="0.6" />

  <!-- TV Chassis -->
  <rect x="34" y="54" width="92" height="64" rx="9" fill="#8AB4F8" />

  <!-- Inset OLED Cinema Screen -->
  <rect x="38" y="58" width="84" height="56" rx="6" fill="#0F131C" />

  <!-- Play Beacon -->
  <path d="M74 76.5 C73.1 76 72 76.6 72 77.7 L72 92.3 C72 93.4 73.1 94 74 93.5 L88 86.2 C88.9 85.7 88.9 84.3 88 83.8 Z" fill="#FFFFFF" />

  <!-- Stream Status Bar -->
  <line x1="50" y1="104" x2="78" y2="104" stroke="#8AB4F8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="82" y1="104" x2="110" y2="104" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" />

  <!-- TV Stand -->
  <rect x="76" y="118" width="8" height="8" fill="#8AB4F8" />
  <rect x="56" y="126" width="48" height="4" rx="2" fill="#8AB4F8" />

  <!-- RIGHT: Typography & Branding (Simple #8AB4F8 & #FFFFFF) -->
  <!-- 'V' -->
  <polygon points="148,60 162,106 174,106 188,60 176,60 168,90 160,60" fill="#8AB4F8" />

  <!-- 'D' -->
  <path d="M196 60 H215 C224.5 60 231 67.5 231 77 V89 C231 98.5 224.5 106 215 106 H196 Z M207 71 V95 H214 C218 95 220 92.5 220 88 V78 C220 73.5 218 71 214 71 Z" fill="#FFFFFF" />

  <!-- 'O' -->
  <path d="M255 60 C244.5 60 238 68 238 78 V88 C238 98 244.5 106 255 106 C265.5 106 272 98 272 88 V78 C272 68 265.5 60 255 60 Z M255 71 C259.5 71 261.5 74 261.5 79 V87 C261.5 92 259.5 95 255 95 C250.5 95 248.5 92 248.5 87 V79 C248.5 74 250.5 71 255 71 Z" fill="#8AB4F8" />

  <!-- 'TV' Pill Badge -->
  <rect x="279" y="66" width="31" height="21" rx="5" fill="#0F131C" stroke="#8AB4F8" stroke-width="1.5" />
  <text x="294.5" y="81" fill="#8AB4F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">TV</text>

  <!-- Accent Divider Line -->
  <rect x="148" y="117" width="162" height="2.5" rx="1.25" fill="#8AB4F8" />

  <!-- Subtitle -->
  <text x="148" y="133" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.2">WIRELESS CINEMA RECEIVER</text>
  <circle cx="152" cy="147" r="2.5" fill="#8AB4F8" />
  <text x="159" y="150" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" letter-spacing="1.2">READY TO CAST • 4K ULTRA HD</text>
</svg>
