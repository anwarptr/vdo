name: Publish APK to DroidStore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.0.0 or v2.0.0)'
        required: false
        default: '2.0.0'
      target_app:
        description: 'Which app to publish'
        type: choice
        options:
          - 'both'
          - 'tv'
          - 'remote'
        default: 'both'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate Project and Build Release APKs
        run: bash build.sh

      - name: Resolve Version Name
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version_name=${{ inputs.version_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy VDO TV to DroidStore
        if: github.event_name == 'push' || inputs.target_app == 'tv' || inputs.target_app == 'both'
        run: |
          curl -f -X POST "${{ secrets.DROIDSTORE_URL }}/api/apks/upload" \
            -H "Authorization: Bearer ${{ secrets.DROIDSTORE_API_KEY }}" \
            -F "apk=@tv/build/outputs/apk/release/vdo-tv-release.apk" \
            -F "appName=VDO TV" \
            -F "packageName=com.example.lancasttv" \
            -F "versionName=${{ steps.versioning.outputs.version_name }}" \
            -F "versionCode=${{ github.run_number }}" \
            -F "targetPlatforms=tv"

      - name: Deploy VDO Remote to DroidStore
        if: github.event_name == 'push' || inputs.target_app == 'remote' || inputs.target_app == 'both'
        run: |
          curl -f -X POST "${{ secrets.DROIDSTORE_URL }}/api/apks/upload" \
            -H "Authorization: Bearer ${{ secrets.DROIDSTORE_API_KEY }}" \
            -F "apk=@app/build/outputs/apk/release/vdo-remote-release.apk" \
            -F "appName=VDO Remote" \
            -F "packageName=com.example.lancast" \
            -F "versionName=${{ steps.versioning.outputs.version_name }}" \
            -F "versionCode=${{ github.run_number }}" \
            -F "targetPlatforms=mobile"
