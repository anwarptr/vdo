name: Build and Publish VDO Cast APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (optional override, e.g. 2.0.0)'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate Gradle Project & Build Release APK
        run: bash build.sh

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: VDOCast-Release-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk

      - name: Resolve Version Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION="${{ inputs.version_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="2.0.${{ github.run_number }}"
          fi
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy VDO TV to DroidStore
        env:
          DROIDSTORE_URL: ${{ secrets.DROIDSTORE_URL }}
          DROIDSTORE_API_KEY: ${{ secrets.DROIDSTORE_API_KEY }}
        run: |
          API_URL="${DROIDSTORE_URL%/}/api/apks/upload"
          MAX_RETRIES=3
          ATTEMPT=1
          SUCCESS=false

          # Pre-ping DroidStore to wake up backend if spinning down/cold starting
          echo "Pre-flight ping to DroidStore server..."
          curl -s -m 25 -A "Mozilla/5.0" "${DROIDSTORE_URL%/}" > /dev/null 2>&1 || true
          sleep 2

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Uploading VDO TV APK (Attempt $ATTEMPT of $MAX_RETRIES)..."
            RESP_FILE=$(mktemp)
            HTTP_CODE=$(curl -s -o "$RESP_FILE" -w "%{http_code}" -X POST "$API_URL" \
              --connect-timeout 30 \
              --max-time 180 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Authorization: Bearer $DROIDSTORE_API_KEY" \
              -F "apk=@tv/build/outputs/apk/release/vdo-tv-release.apk" \
              -F "appName=VDO TV" \
              -F "packageName=com.example.lancasttv" \
              -F "versionName=${{ steps.versioning.outputs.version_name }}" \
              -F "versionCode=${{ github.run_number }}" \
              -F "targetPlatforms=tv")

            echo "DroidStore TV Upload HTTP Status: $HTTP_CODE"
            cat "$RESP_FILE"
            echo ""

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              SUCCESS=true
              rm -f "$RESP_FILE"
              break
            fi

            echo "::warning::Upload attempt $ATTEMPT failed with HTTP $HTTP_CODE"
            rm -f "$RESP_FILE"

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              WAIT_SEC=$((ATTEMPT * 15))
              echo "Cloudflare/origin timeout (HTTP $HTTP_CODE). Waiting ${WAIT_SEC}s before retry..."
              sleep $WAIT_SEC
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Failed to deploy VDO TV to DroidStore after $MAX_RETRIES attempts (Last HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Deploy VDO Remote to DroidStore
        env:
          DROIDSTORE_URL: ${{ secrets.DROIDSTORE_URL }}
          DROIDSTORE_API_KEY: ${{ secrets.DROIDSTORE_API_KEY }}
        run: |
          API_URL="${DROIDSTORE_URL%/}/api/apks/upload"
          MAX_RETRIES=3
          ATTEMPT=1
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Uploading VDO Remote APK (Attempt $ATTEMPT of $MAX_RETRIES)..."
            RESP_FILE=$(mktemp)
            HTTP_CODE=$(curl -s -o "$RESP_FILE" -w "%{http_code}" -X POST "$API_URL" \
              --connect-timeout 30 \
              --max-time 180 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Authorization: Bearer $DROIDSTORE_API_KEY" \
              -F "apk=@app/build/outputs/apk/release/vdo-remote-release.apk" \
              -F "appName=VDO Remote" \
              -F "packageName=com.example.lancast" \
              -F "versionName=${{ steps.versioning.outputs.version_name }}" \
              -F "versionCode=${{ github.run_number }}" \
              -F "targetPlatforms=mobile")

            echo "DroidStore Remote Upload HTTP Status: $HTTP_CODE"
            cat "$RESP_FILE"
            echo ""

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              SUCCESS=true
              rm -f "$RESP_FILE"
              break
            fi

            echo "::warning::Upload attempt $ATTEMPT failed with HTTP $HTTP_CODE"
            rm -f "$RESP_FILE"

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              WAIT_SEC=$((ATTEMPT * 15))
              echo "Cloudflare/origin timeout (HTTP $HTTP_CODE). Waiting ${WAIT_SEC}s before retry..."
              sleep $WAIT_SEC
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Failed to deploy VDO Remote to DroidStore after $MAX_RETRIES attempts (Last HTTP $HTTP_CODE)"
            exit 1
          fi
