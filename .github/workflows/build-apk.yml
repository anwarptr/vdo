name: Build and Publish VDO Cast APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (optional override, e.g. 2.0.0)'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate Gradle Project & Build Release APK
        run: bash build.sh

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: VDOCast-Release-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk

      - name: Resolve Version Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION="${{ inputs.version_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="2.0.${{ github.run_number }}"
          fi
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy VDO TV to DroidStore
        run: |
          curl -f -X POST "${{ secrets.DROIDSTORE_URL }}/api/apks/upload" \
            -H "Authorization: Bearer ${{ secrets.DROIDSTORE_API_KEY }}" \
            -F "apk=@tv/build/outputs/apk/release/vdo-tv-release.apk" \
            -F "appName=VDO TV" \
            -F "packageName=com.example.lancasttv" \
            -F "versionName=${{ steps.versioning.outputs.version_name }}" \
            -F "versionCode=${{ github.run_number }}" \
            -F "targetPlatforms=tv"

      - name: Deploy VDO Remote to DroidStore
        run: |
          curl -f -X POST "${{ secrets.DROIDSTORE_URL }}/api/apks/upload" \
            -H "Authorization: Bearer ${{ secrets.DROIDSTORE_API_KEY }}" \
            -F "apk=@app/build/outputs/apk/release/vdo-remote-release.apk" \
            -F "appName=VDO Remote" \
            -F "packageName=com.example.lancast" \
            -F "versionName=${{ steps.versioning.outputs.version_name }}" \
            -F "versionCode=${{ github.run_number }}" \
            -F "targetPlatforms=mobile"
